services:
  postgres:
    image: postgres:16-alpine
    container_name: scribe-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-scribe}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scribe_secret}
      POSTGRES_DB: ${DB_DATABASE:-scribe}
    ports:
      - "${DB_PORT_MACHINE:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scribe-redis
    ports:
      - "${REDIS_PORT_MACHINE:-6379}:6379"

  backend:
    build: ./
    container_name: scribe-api
    volumes:
      - ./:/app/
      - /app/node_modules
    ports:
      - "${SERVER_PORT_MACHINE:-3000}:${SERVER_PORT:-3000}"
      - "9229:9229"
    depends_on:
      - postgres
      - redis
    env_file: ".env"

  # Notiscope is a separate, independent service running on EC2 at http://13.60.84.255:8000
  # Scribe calls it via HTTP — no local container needed.

volumes:
  postgres_data:
